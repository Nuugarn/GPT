<!doctype html>

  <style>
* {

}

:root {

}

body {

  min-height: 100vh;
  background:

button, select {

.eyebrow {

}

h1, h2, p {

}

.subtitle {

.category-widget {

/* Desktop-first layout: on small screens the whole page keeps its desktop

  <script>
function normalizeLocation(value){
  const text=String(value??"").trim().replace(/\s+/g," ");
  if(!text)return "";
  const compact=text.replace(/\s/g,"");
  if(compact==="บ้าน1")return "บ้าน 1";
  if(compact==="บ้าน2")return "บ้าน 2";
  return text;
}

/*
  ====== ตั้งค่าการเชื่อมต่อ ======
  แทนที่ URL ด้านล่างด้วย Web App URL ที่ได้จากการ Deploy Google Apps Script
  (Deploy > New deployment > Web app > Execute as: Me > Who has access: Anyone)

  Backend ตรวจสอบรูปแบบข้อมูลและจำกัดค่าที่รับเข้าแทนการฝัง Secret ไว้ใน Frontend
*/
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1sjPJMsU24E-DNbBNWcezr7LhGLc2kLM4KOGnc9pw9CpC_PWTIIcjl0B0MWNKdUrfDw/exec";

let transactions = [];
let categories = [];

const summaryValues={balance:0,income:0,expense:0,expenseCategory:"ทั้งหมด"};
let selectedLocationValue="all";
let selectedCategoryValue="all";
let selectedMonthValue="all";
let selectedDayValue="all";
let openId=null;

const thaiMonthNames=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

// อ่านค่า datetime แบบ ISO (เช่น "2026-02-20T14:49:00") กลับมาเป็นชิ้นส่วนวันที่
// ที่ใช้งานง่าย (ปียังเป็น ค.ศ. ณ จุดนี้ ยังไม่แปลงเป็น พ.ศ.)
function parseIsoDate(iso){
  if(!iso) return null;
  const [datePart,timePart=""]=String(iso).split("T");
  const [y,m,d]=datePart.split("-").map(Number);
  if(!y||!m||!d) return null;
  return {
    year:y,
    monthIndex:m-1,
    monthName:thaiMonthNames[m-1],
    day:d,
    time:timePart.slice(0,5) // "HH:MM"
  };
}
// แปลงเป็นข้อความวันที่แบบไทย (พ.ศ.) สำหรับแสดงผลเท่านั้น
function formatThaiDate(iso){
  const d=parseIsoDate(iso);
  if(!d) return "";
  return `${d.day} ${d.monthName} ${d.year+543}`;
}
function formatThaiTime(iso){
  const d=parseIsoDate(iso);
  return d&&d.time ? `${d.time} น.` : "";
}
function monthKey(item){
  const d=parseIsoDate(item.datetime); return d?`${d.year}-${String(d.monthIndex).padStart(2,"0")}`:"";
}
function dayKey(item){
  const d=parseIsoDate(item.datetime); return d?`${monthKey(item)}-${String(d.day).padStart(2,"0")}`:"";
}
function monthLabel(key){
  if(key==="all") return "ทั้งหมด";
  const [y,m]=key.split("-").map(Number);
  return `${thaiMonthNames[m]} ${y+543}`;
}
function money(v){
  return new Intl.NumberFormat("th-TH",{style:"currency",currency:"THB",minimumFractionDigits:0,maximumFractionDigits:2}).format(v);
}

function populateMonthOptions(){
  const months=[...new Set(transactions.map(monthKey).filter(Boolean))].sort().reverse();
  monthSelect.innerHTML=`<option value="all">ทั้งหมด</option>${months.map(k=>`<option value="${k}">${monthLabel(k)}</option>`).join("")}`;
  selectedMonthValue=months[0]||"all";
  monthSelect.value=selectedMonthValue;
  populateDayOptions();
}
function populateDayOptions(){
  const rows=transactions
    .filter(x=>selectedLocationValue==="all"||x.location===selectedLocationValue)
    .filter(x=>selectedMonthValue==="all"||monthKey(x)===selectedMonthValue)
    .map(x=>({key:dayKey(x),date:parseIsoDate(x.datetime)}))
    .filter(x=>x.date)
    .sort((a,b)=>b.key.localeCompare(a.key));
  const seen=new Set(), unique=[];
  rows.forEach(x=>{if(!seen.has(x.key)){seen.add(x.key);unique.push(x);}});
  daySelect.innerHTML=`<option value="all">ทั้งหมด</option>${unique.map(x=>`<option value="${x.key}">${x.date.day} ${x.date.monthName} ${x.date.year+543}</option>`).join("")}`;
  selectedDayValue="all";
  daySelect.value="all";
}

function renderLocationMenu(){
  locationOptionsDynamic.innerHTML=locations.map(name=>
    `<button class="location-option ${selectedLocationValue===name?"active":""}" type="button" data-location="${escapeHtml(name)}">${name}</button>`
  ).join("");

  locationOptionsDynamic.querySelectorAll(".location-option").forEach(o=>
    o.addEventListener("click",()=>selectLocation(o.dataset.location))
  );

  document.querySelector('.location-option[data-location="all"]')
    .classList.toggle("active",selectedLocationValue==="all");
}

// สร้างรายการหมวดหมู่ในเมนูแบบ dynamic จาก categories ที่ดึงมาจาก Data source
// (แทนที่การ hardcode ปุ่มไว้ตรงๆ ใน HTML)
function renderCategoryMenu(){
  categoryOptionsDynamic.innerHTML=categories.map(name=>
    `<button class="category-option ${selectedCategoryValue===name?"active":""}" type="button" data-category="${name}">${name}</button>`
  ).join("");
  categoryOptionsDynamic.querySelectorAll(".category-option").forEach(o=>
    o.addEventListener("click",()=>selectCategory(o.dataset.category))
  );
  document.querySelector('.category-option[data-category="all"]')
    .classList.toggle("active",selectedCategoryValue==="all");
}

function dateFiltered(){
  return transactions.filter(x=>{
    const loc=selectedLocationValue==="all"||x.location===selectedLocationValue;
    const mm=selectedMonthValue==="all"||monthKey(x)===selectedMonthValue;
    const dd=selectedDayValue==="all"||dayKey(x)===selectedDayValue;
    return loc&&mm&&dd;
  });
}

function calculateSummary(){
  const data=dateFiltered();

  // รายรับของกล่องรายรับ: ตามเดือน/วันที่ที่เลือก
  // (ไม่แยกตามหมวดหมู่)
  summaryValues.income=data
    .filter(x=>x.type==="income")
    .reduce((s,x)=>s+x.amount,0);

  // รายจ่ายของกล่องรายจ่าย: ตามเดือน/วันที่ + หมวดหมู่ที่เลือก
  summaryValues.expense=data
    .filter(x=>
      x.type==="expense" &&
      (selectedCategoryValue==="all" || x.category===selectedCategoryValue)
    )
    .reduce((s,x)=>s+x.amount,0);

  /*
    เงินคงเหลือ = ยอดสะสมตั้งแต่ต้นเดือนจนถึงวันที่เลือก

    ตัวอย่าง:
    วันที่ 5  รับ +10,000
    วันที่ 7  จ่าย -2,000
    วันที่ 8  จ่าย -2,000

    เลือกวันที่ 7  -> 8,000
    เลือกวันที่ 8  -> 6,000

    สำคัญ:
    - ไม่สนหมวดหมู่ที่เลือก
    - ถ้าเลือก "ทั้งหมด" ในวันที่ จะใช้ข้อมูลทั้งเดือน
    - ถ้าเลือกวันที่ จะรวมเฉพาะรายการในเดือนเดียวกันตั้งแต่วันที่ 1
      ถึงวันที่เลือก
  */
  // เงินคงเหลือใช้ขอบเขตสถานที่ + เดือน/วันที่
  // แต่ไม่สนหมวดหมู่ เพื่อรักษากฎเดิมของระบบ
  let balanceData = transactions.filter(x=>
    selectedLocationValue==="all" || x.location===selectedLocationValue
  );

  if(selectedMonthValue !== "all"){
    balanceData = balanceData.filter(x=>monthKey(x)===selectedMonthValue);
  }

  if(selectedDayValue !== "all"){
    const selectedDate = selectedDayValue!=="all" ? parseIsoDate(selectedDayValue+"T00:00:00") : null;

    if(selectedDate){
      balanceData = balanceData.filter(x=>{
        const d=parseIsoDate(x.datetime);
        if(!d) return false;

        const sameMonth = monthKey(x) === selectedMonthValue;
        const onOrBeforeSelectedDay = d.day <= selectedDate.day;

        return sameMonth && onOrBeforeSelectedDay;
      });
    }
  }

  const balanceIncome=balanceData
    .filter(x=>x.type==="income")
    .reduce((s,x)=>s+x.amount,0);

  const balanceExpense=balanceData
    .filter(x=>x.type==="expense")
    .reduce((s,x)=>s+x.amount,0);

  summaryValues.balance=balanceIncome-balanceExpense;

  document.querySelector("#income").textContent=money(summaryValues.income);
  document.querySelector("#expense").textContent=money(summaryValues.expense);
  document.querySelector("#balance").textContent=money(summaryValues.balance);
  document.querySelector("#balanceLabel").textContent=selectedLocationValue==="all"?"เงินคงเหลือรวม":`เงินคงเหลือ ${selectedLocationValue}`;

  document.querySelector("#expenseLabel").innerHTML=
    selectedCategoryValue==="all"
      ? "รายจ่าย"
      : `รายจ่าย <span class="summary-filter-label">(${selectedCategoryValue})</span>`;
}
function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function houseMatches(x, house){
  const itemLocation=normalizeLocation(x.location);
  return house==="ยังไม่ระบุบ้าน" ? !itemLocation : itemLocation===normalizeLocation(house);
}

function getHouseSummary(house, rows){
  const income=rows
    .filter(x=>houseMatches(x,house) && x.type==="income")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  const expense=rows
    .filter(x=>houseMatches(x,house) && x.type==="expense")
    .filter(x=>selectedCategoryValue==="all"||x.category===selectedCategoryValue)
    .reduce((s,x)=>s+Number(x.amount||0),0);

  // Balance never follows category; it is scoped only by house and date period.
  let balanceData=transactions.filter(x=>houseMatches(x,house));
  if(selectedMonthValue!=="all") balanceData=balanceData.filter(x=>monthKey(x)===selectedMonthValue);

  if(selectedDayValue!=="all"){
    const selectedDate=parseIsoDate(selectedDayValue+"T00:00:00");
    if(selectedDate){
      balanceData=balanceData.filter(x=>{
        const d=parseIsoDate(x.datetime);
        return d && monthKey(x)===selectedMonthValue && d.day<=selectedDate.day;
      });
    }
  }

  const balanceIncome=balanceData.filter(x=>x.type==="income")
    .reduce((s,x)=>s+Number(x.amount||0),0);
  const balanceExpense=balanceData.filter(x=>x.type==="expense")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  return {income,expense,balance:balanceIncome-balanceExpense};
}

function render(){
  const filtered=dateFiltered()
    .filter(x=>selectedCategoryValue==="all"||x.category===selectedCategoryValue)
    .sort((a,b)=>a.datetime.localeCompare(b.datetime));

  itemCount.textContent=`${filtered.length} รายการ`;
  currentPeriodTitle.textContent=selectedMonthValue==="all" ? "รายการแยกตามบ้าน" : `รายการ ${monthLabel(selectedMonthValue)}`;

  // แสดงบ้านหลักก่อน แล้วตามด้วยสถานที่เก่าที่มีข้อมูลอยู่จริง
  const hasUnassigned=transactions.some(x=>!String(x.location||"").trim());
  const orderedHouses=[...new Set([
    "บ้าน 1",
    "บ้าน 2",
    ...locations,
    ...(hasUnassigned?["ยังไม่ระบุบ้าน"]:[])
  ])].filter(Boolean);

  const visibleHouses=selectedLocationValue==="all"
    ? orderedHouses
    : orderedHouses.filter(h=>h===selectedLocationValue);

  housesContainer.innerHTML=visibleHouses.map(house=>{
    const rows=filtered.filter(x=>houseMatches(x,house));
    const summary=getHouseSummary(house, dateFiltered());

    const tableRows=rows.length ? rows.map(item=>{
      const open=openId===item.id;
      return `
        <tr class="transaction-row ${open?"is-open":""}">
          <td><span class="category-badge ${item.type==="expense" ? "expense-badge" : ""}">${item.type==="income"?"รายรับ":"รายจ่าย"}</span></td>
          <td><span class="table-date">${formatThaiDate(item.datetime)}</span></td>
          <td><button class="detail-button" data-id="${item.id}" type="button">${escapeHtml(item.title)} <span class="row-time">${formatThaiTime(item.datetime)}</span></button></td>
          <td><span class="table-amount ${item.type}">${item.type==="income"?"+":"-"} ${money(item.amount)}</span></td>
        </tr>
        ${open?`
        <tr class="detail-row-full"><td colspan="4"><div class="detail-panel">
          <div class="detail-line type ${item.type==="income"?"type-income":"type-expense"}">${item.type==="income"?"รายรับ":"รายจ่าย"}</div>
          <div class="detail-line category-detail">${escapeHtml(item.category)}</div>
          <div class="detail-line title">${escapeHtml(item.title)}</div>
          <div class="detail-line description">${escapeHtml(item.detail)}</div>
          <div class="detail-line date-time">${formatThaiTime(item.datetime)} ${formatThaiDate(item.datetime)}</div>
          <div class="detail-line">${item.image?`<button class="image-trigger" type="button" data-image-id="${item.id}">ภาพประกอบ (สลิป) — กดเพื่อดูภาพ</button>`:`<span class="no-image">ไม่มีภาพประกอบ</span>`}</div>
        </div></td></tr>`:""}`;
    }).join("") : `<tr><td colspan="4"><div class="house-empty">ไม่มีรายการของ${escapeHtml(house)}ตามตัวกรองที่เลือก</div></td></tr>`;

    return `
      <section class="house-panel" data-house="${escapeHtml(house)}">
        <div class="house-panel-header">
          <h3 class="house-panel-title">${escapeHtml(house)}</h3>
          <p class="house-panel-subtitle">คำนวณรายรับ รายจ่าย และเงินคงเหลือแยกจากบ้านอื่น</p>
        </div>
        <div class="house-summary">
          <div class="house-summary-card balance"><span>เงินคงเหลือ</span><strong>${money(summary.balance)}</strong></div>
          <div class="house-summary-card income"><span>รายรับ</span><strong>${money(summary.income)}</strong></div>
          <div class="house-summary-card expense"><span>รายจ่าย${selectedCategoryValue!=="all"?` (${escapeHtml(selectedCategoryValue)})`:""}</span><strong>${money(summary.expense)}</strong></div>
        </div>
        <div class="house-table-wrap transaction-table-wrap">
          <table class="transaction-table">
            <thead><tr><th>ประเภท</th><th>วันที่</th><th>รายละเอียด</th><th>จำนวนเงิน</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </section>`;
  }).join("");

  housesContainer.querySelectorAll(".detail-button").forEach(b=>b.addEventListener("click",()=>{
    const id=Number(b.dataset.id); openId=openId===id?null:id; render();
  }));

  housesContainer.querySelectorAll(".image-trigger").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const item=transactions.find(x=>x.id===Number(b.dataset.imageId));
    if(!item?.image)return;
    previewImage.src=toEmbeddableDriveUrl(item.image);
    previewImage.alt=`ภาพประกอบ: ${item.title}`;
    imageDialog.showModal();
  }));
}
function toEmbeddableDriveUrl(url){
  if(!url) return url;
  const m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const fileId = m ? m[1] : null;
  if(!fileId) return url;
  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
}
function refresh(){calculateSummary();render();}
function selectLocation(v){
  selectedLocationValue=v;
  openId=null;
  selectedLocation.textContent=v==="all"?"บ้าน: ทั้งหมด":`บ้าน: ${v}`;
  renderLocationMenu();
  locationMenu.classList.remove("open");
  locationSelectButton.setAttribute("aria-expanded","false");
  populateDayOptions();
  refresh();
}

function selectCategory(v){
  selectedCategoryValue=v; openId=null;
  selectedCategory.textContent=v==="all"?"หมวดหมู่: ทั้งหมด":`หมวดหมู่: ${v}`;
  renderCategoryMenu();
  categoryMenu.classList.remove("open"); categorySelectButton.setAttribute("aria-expanded","false"); refresh();
}

locationSelectButton.addEventListener("click",e=>{
  e.stopPropagation();
  const open=locationMenu.classList.toggle("open");
  categoryMenu.classList.remove("open");
  categorySelectButton.setAttribute("aria-expanded","false");
  locationSelectButton.setAttribute("aria-expanded",String(open));
});

document.querySelector('.location-option[data-location="all"]').addEventListener("click",()=>selectLocation("all"));

categorySelectButton.addEventListener("click",e=>{
  e.stopPropagation();
  const open=categoryMenu.classList.toggle("open");
  locationMenu.classList.remove("open");
  locationSelectButton.setAttribute("aria-expanded","false");
  categorySelectButton.setAttribute("aria-expanded",String(open));
});
document.querySelector('.category-option[data-category="all"]').addEventListener("click",()=>selectCategory("all"));

monthSelect.addEventListener("change",()=>{selectedMonthValue=monthSelect.value;openId=null;populateDayOptions();refresh();});
daySelect.addEventListener("change",()=>{selectedDayValue=daySelect.value;openId=null;refresh();});
document.addEventListener("click",e=>{
  if(!document.querySelector("#categoryWidget").contains(e.target)){
    categoryMenu.classList.remove("open");
    categorySelectButton.setAttribute("aria-expanded","false");
  }
  if(!document.querySelector("#locationWidget").contains(e.target)){
    locationMenu.classList.remove("open");
    locationSelectButton.setAttribute("aria-expanded","false");
  }
});
closeImageDialog.addEventListener("click",()=>{imageDialog.close();previewImage.src="";});
imageDialog.addEventListener("click",e=>{if(e.target===imageDialog){imageDialog.close();previewImage.src="";}});
document.querySelector("#addButton").addEventListener("click",()=>{window.location.href="form.html";});

// ส่ง POST ไปยัง Apps Script โดยใช้ text/plain เพื่อเลี่ยง CORS preflight
// (Apps Script Web App ไม่รองรับ preflight request ของ Content-Type: application/json โดยตรง)
async function postToBackend(payload){
  const res=await fetch(APPS_SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  });
  return res.json();
}

function showLoading(){
  loadingState.hidden=false;
  errorState.hidden=true;
  housesContainer.style.display="none";
}
function showError(){
  loadingState.hidden=true;
  errorState.hidden=false;
  housesContainer.style.display="none";
}
function showData(){
  loadingState.hidden=true;
  errorState.hidden=true;
  housesContainer.style.display="";
}

async function loadData(){
  showLoading();
  try{
    const res=await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error("network error");
    const data=await res.json();

    transactions=(data.transactions||[]).map(t=>({
      id:Number(t.id),
      datetime:t.datetime,
      location:normalizeLocation(t.location),
      type:t.type,
      category:t.category||"",
      title:t.title,
      detail:t.detail||"",
      amount:Number(t.amount),
      image:t.imageUrl||""
    }));
    categories=data.categories||[];
    locations=[...new Set([
      "บ้าน 1",
      "บ้าน 2",
      ...(data.locations||[]),
      ...transactions.map(t=>String(t.location||"").trim()).filter(Boolean)
    ])].filter(Boolean).sort((a,b)=>{
      const order={"บ้าน 1":0,"บ้าน 2":1};
      if(a in order || b in order) return (order[a]??999)-(order[b]??999);
      return a.localeCompare(b,"th");
    });

    renderLocationMenu();
    renderCategoryMenu();
    populateMonthOptions();
    refresh();
    showData();
  }catch(err){
    showError();
  }
}

retryButton.addEventListener("click",loadData);

loadData();
  </script>
